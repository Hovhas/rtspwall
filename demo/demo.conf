# rtspwall demo configuration — used by rtspwall-demo.service
# (`sudo rtspwall demo`). No cameras needed: the "URLs" are local clips
# (CC0, generated by demo/make-clips.sh), played paced by their timestamps
# and looped.
#
# 2x2 grid: cells 1-3 show one clip each; cell 4 is a rotation group of two
# clips that take turns every 8 seconds (both keep decoding, so the switch
# has no black frame). Total decoder load for all five: about 22 %.

GRID=2x2
ROTATE_SECONDS=8

cam1|/usr/share/rtspwall/demo/cam1.mp4|1
cam2|/usr/share/rtspwall/demo/cam2.mp4|2
cam3|/usr/share/rtspwall/demo/cam3.mp4|3
cam4|/usr/share/rtspwall/demo/cam4.mp4|4
cam5|/usr/share/rtspwall/demo/cam5.mp4|4
