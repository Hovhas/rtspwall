# rtspwall example configuration
#
# Copy to /etc/rtspwall/cameras.conf and adjust. The file contains camera
# credentials — keep it readable by root only (chmod 600) and out of git.
#
# Validate without touching the display, decoder or network:
#   rtspwall --check-config /etc/rtspwall/cameras.conf
#   rtspwall --check-config --mode 1280x720 /etc/rtspwall/cameras.conf
#
# Lines starting with '#' are comments. Global settings are KEY=VALUE lines
# and may appear anywhere in the file; an unknown key only produces a
# warning.

# ----------------------------------------------------------------- globals

# How far ahead (from the stream's pts + the measured network delay) each
# frame is scheduled for display. Higher = smoother but more latency; lower
# = snappier but a late frame is more likely to be skipped. Default 160.
#BUFFER_MS=160

# Seconds each camera is shown at a time within a rotation group (cameras
# sharing a tile, see below). Default 15.
#ROTATE_SECONDS=15

# V4L2 memory-to-memory H.264 decoder. Default /dev/video10 (bcm2835-codec).
#DECODER=/dev/video10

# DRM connector to use, as named by the kernel (HDMI-A-1, HDMI-A-2, ...).
# Default: the first connected display.
#CONNECTOR=HDMI-A-1

# DRM device to drive. Default "auto": scan /dev/dri/card0..card15 and use
# the first one with a connected display (or, with CONNECTOR set, the first
# one that has that connector). Card numbers can change between kernels.
#DRM_DEVICE=auto

# How much of FFmpeg's own logging reaches the log: quiet, error, warning or
# info. Default error. "warning" shows e.g. RTP packet loss when debugging.
# URLs in these lines are masked like everywhere else.
#FFMPEG_LOGLEVEL=error

# ------------------------------------------------------------- grid layout
#
# GRID=COLSxROWS splits the screen into equal cells, computed from the
# display's actual resolution. Camera lines are then:
#
#   name|rtsp-url|cell[|delay_ms]
#
# Cells are numbered from 1, row by row: in a 2x2 grid 1 is top left, 2 top
# right, 3 bottom left and 4 bottom right. delay_ms (optional, default 0,
# range -10000..10000) adds extra delay for just that camera on top of BUFFER_MS, e.g. if its
# network path is consistently slower than the others.
#
# Cameras given the SAME cell form a rotation group: they take turns being
# shown, ROTATE_SECONDS each. All of them stay connected and decoding all
# the time, so a switch is instant (no black frame). The first one listed
# for a cell starts visible. Every camera needs its own hardware plane and
# decoder instance, whether it is currently shown or not.
#
# Below: two fixed cameras on top, two rotating pairs at the bottom.

GRID=2x2

front-door|rtsp://viewer:CHANGE_ME@192.168.1.10:554/stream1|1
driveway|rtsp://viewer:CHANGE_ME@192.168.1.11:554/stream1|2
garage|rtsp://viewer:CHANGE_ME@192.168.1.12:554/stream1|3
backyard|rtsp://viewer:CHANGE_ME@192.168.1.13:554/stream1|4
side-gate|rtsp://viewer:CHANGE_ME@192.168.1.14:554/stream1|3
shed|rtsp://viewer:CHANGE_ME@192.168.1.15:554/stream1|4|40

# ----------------------------------------------------------- manual layout
#
# Alternatively, leave out GRID and give each camera an explicit tile in
# screen pixels:
#
#   name|rtsp-url|width|height|x|y[|delay_ms]
#
# The tile is the size on screen, not the stream's resolution — the display
# hardware scales. Cameras with exactly the same width|height|x|y form a
# rotation group, just like a shared cell above. The two formats cannot be
# mixed in one file.
#
# The same wall as above, for a 1920x1080 display:
#
#front-door|rtsp://viewer:CHANGE_ME@192.168.1.10:554/stream1|960|540|0|0
#driveway|rtsp://viewer:CHANGE_ME@192.168.1.11:554/stream1|960|540|960|0
#garage|rtsp://viewer:CHANGE_ME@192.168.1.12:554/stream1|960|540|0|540
#backyard|rtsp://viewer:CHANGE_ME@192.168.1.13:554/stream1|960|540|960|540
#side-gate|rtsp://viewer:CHANGE_ME@192.168.1.14:554/stream1|960|540|0|540
#shed|rtsp://viewer:CHANGE_ME@192.168.1.15:554/stream1|960|540|960|540|40
