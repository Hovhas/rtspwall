# rtspwall configuration
#
# Installed as /etc/rtspwall/cameras.conf. It holds camera passwords, so it
# is owned by root and readable by the service group only:
#
#   sudo chown root:rtspwall /etc/rtspwall/cameras.conf
#   sudo chmod 0640 /etc/rtspwall/cameras.conf
#
# (chmod 600 would lock the service itself out.) Keep it out of git.
#
# Out of the box no camera is configured and the service will not start -
# it says "no cameras configured". To get going:
#
#   1. Find each camera's RTSP URL (see "Where do I find the URL?" below).
#   2. Uncomment one of the example camera lines further down and put your
#      URL in it, or add your own line.
#   3. Check the file, then start the wall:
#        sudo rtspwall --check-config /etc/rtspwall/cameras.conf
#        sudo systemctl restart rtspwall
#
# --check-config validates without touching the display, decoder or
# network. It rejects leftover placeholders (CHANGE_ME, <...>) and unknown
# keys ("did you mean CONNECTOR?"); the running service only warns about
# unknown keys, so an upgrade never stops a working wall.
#   sudo rtspwall --check-config --mode 1280x720 /etc/rtspwall/cameras.conf
# shows the layout for another screen size.
#
# Lines starting with '#' are comments. Global settings are KEY=VALUE lines
# and may appear anywhere in the file.

# ----------------------------------------------------------------- globals

# How far ahead (from the stream's pts + the measured network delay) each
# frame is scheduled for display. Higher = smoother but more latency; lower
# = snappier but a late frame is more likely to be skipped. Default 160.
#BUFFER_MS=160

# Seconds each camera is shown at a time within a rotation group (cameras
# sharing a cell, see below). Default 15.
#ROTATE_SECONDS=15

# Display mode. "auto" (default) keeps the display's preferred mode, except
# that a 4K or a below-50-Hz preferred mode is replaced by the best mode up
# to 1920 wide with the same shape (a 4K TV runs at 1920x1080@60: smoother,
# and 4K adds nothing for cameras of 1080p or less). Or pick one: WxH or
# WxH@Hz, e.g. 1280x720@50. If the display does not offer it, the service
# says so and lists the modes it does offer.
#MODE=auto

# UniFi Protect shows its streams as rtsps://HOST:7441/TOKEN?enableSrtp.
# You can paste that as it is: with "auto" (default) rtspwall turns it into
# the plain-RTSP form rtsp://HOST:7447/TOKEN and logs that it did. "off"
# uses the URL exactly as written.
#UNIFI_REWRITE=auto

# V4L2 memory-to-memory H.264 decoder. Default /dev/video10 (bcm2835-codec
# on a Raspberry Pi 4). A Raspberry Pi 5 has no H.264 hardware decoder.
#DECODER=/dev/video10

# DRM connector to use, as named by the kernel (HDMI-A-1, HDMI-A-2, ...).
# Default: the first connected display.
#CONNECTOR=HDMI-A-1

# DRM device to drive. Default "auto": scan /dev/dri/card0..card15 and use
# the first one with a connected display (or, with CONNECTOR set, the first
# one that has that connector). Card numbers can change between kernels.
#DRM_DEVICE=auto

# How much of FFmpeg's own logging reaches the log: quiet, error, warning or
# info. Default error. "warning" shows e.g. RTP packet loss when debugging.
# URLs in these lines are masked like everywhere else.
#FFMPEG_LOGLEVEL=error

# ------------------------------------------------------------- grid layout
#
# GRID=COLSxROWS splits the screen into equal cells, computed from the
# display's actual resolution. Camera lines are then:
#
#   name|url|cell[|delay_ms]
#
# Cells are numbered from 1, row by row. In a 2x2 grid:
#
#   +-----+-----+
#   |  1  |  2  |
#   +-----+-----+
#   |  3  |  4  |
#   +-----+-----+
#
# In a 3x3 grid the top row is 1 2 3, the middle row 4 5 6, the bottom 7 8 9.
#
# delay_ms (optional, default 0, range -10000..10000) adds extra delay for
# just that camera on top of BUFFER_MS, e.g. if its network path is
# consistently slower than the others.
#
# Cameras given the SAME cell form a rotation group: they take turns being
# shown, ROTATE_SECONDS each. All of them stay connected and decoding all
# the time, so a switch is instant (no black frame). The first one listed
# for a cell starts visible. Every camera needs its own hardware plane and
# decoder instance, whether it is currently shown or not.

GRID=2x2

# ---------------------------------------------------------------- cameras
#
# Use the camera's SUB-STREAM (lower resolution, e.g. 640x360 or 1280x720)
# whenever it has one: on a 2x2 wall each tile is at most 960x540 anyway,
# and the Raspberry Pi 4 decoder handles only H.264 up to 1920x1920, with a
# limited total budget. Main streams in 4K or H.265 will not play.
#
# Where do I find the URL?
#   UniFi Protect: camera > Settings > Advanced > RTSP: enable a stream
#     (Low or Medium), copy the rtsps://...:7441/...?enableSrtp link as it
#     is (see UNIFI_REWRITE above). Turn off "Enhanced encoding" (H.265).
#   Reolink:    rtsp://USER:PASSWORD@IP:554/h264Preview_01_sub
#   Hikvision:  rtsp://USER:PASSWORD@IP:554/Streaming/Channels/102
#   Dahua/Amcrest: rtsp://USER:PASSWORD@IP:554/cam/realmonitor?channel=1&subtype=1
#   Frigate/go2rtc: rtsp://FRIGATE-HOST:8554/CAMERA-NAME_sub (or as restreamed)
#   Others: the camera's manual or web interface, or the NVR's RTSP page.
#
# Special characters in the password must be percent-encoded in the URL:
#   |  ->  %7C      (a bare '|' would split the line into fields)
#   @  ->  %40
#   #  ->  %23
#   :  ->  %3A
#   %  ->  %25
#
# Remove the '#' in front of a line to enable it and replace every
# CHANGE_ME with the real value. A line that still contains CHANGE_ME (or a
# <placeholder>) is rejected, with its line number.

#front-door|rtsp://viewer:CHANGE_ME@192.168.1.10:554/stream2|1
#driveway|rtsp://viewer:CHANGE_ME@192.168.1.11:554/stream2|2
#garage|rtsps://192.168.1.1:7441/CHANGE_ME?enableSrtp|3
#backyard|rtsp://viewer:CHANGE_ME@192.168.1.13:554/stream2|4

# Two more cameras sharing cells 3 and 4 with the ones above form rotation
# groups (the shed's last field is a 40 ms extra delay):
#side-gate|rtsp://viewer:CHANGE_ME@192.168.1.14:554/stream2|3
#shed|rtsp://viewer:CHANGE_ME@192.168.1.15:554/stream2|4|40

# ----------------------------------------------------------- manual layout
#
# Alternatively, leave out GRID and give each camera an explicit tile in
# screen pixels:
#
#   name|url|width|height|x|y[|delay_ms]
#
# The tile is the size on screen, not the stream's resolution - the display
# hardware scales. Cameras with exactly the same width|height|x|y form a
# rotation group, just like a shared cell above. The two formats cannot be
# mixed in one file.
#
# The same wall as above, for a 1920x1080 display (comment out GRID first):
#
#front-door|rtsp://viewer:CHANGE_ME@192.168.1.10:554/stream2|960|540|0|0
#driveway|rtsp://viewer:CHANGE_ME@192.168.1.11:554/stream2|960|540|960|0
#garage|rtsps://192.168.1.1:7441/CHANGE_ME?enableSrtp|960|540|0|540
#backyard|rtsp://viewer:CHANGE_ME@192.168.1.13:554/stream2|960|540|960|540
